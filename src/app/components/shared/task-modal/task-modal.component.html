<app-modal
  [isOpen]="isOpen"
  [title]="isViewMode ? 'Visualizar Tarefa' : (task?.id ? 'Editar Tarefa' : 'Nova Tarefa')"
  size="lg"
  (closed)="onModalClose()"
>
  <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="task-form">
    <div class="form-grid">
      <div class="form-group full-width">
        <label for="title">
          Título da Tarefa <span class="required">*</span>
        </label>
        <input
          type="text"
          id="title"
          formControlName="title"
          class="form-input"
          [class.error]="isFieldInvalid('title')"
          placeholder="Digite o título da tarefa"
        />
        <div class="error-message" *ngIf="isFieldInvalid('title')">
          Título é obrigatório
        </div>
      </div>

      <div class="form-group full-width">
        <label for="description">Descrição</label>
        <textarea
          id="description"
          formControlName="description"
          class="form-textarea"
          rows="3"
          placeholder="Descreva os detalhes da tarefa"
        ></textarea>
      </div>

      <div class="form-group">
        <label for="client"> Cliente <span class="required">*</span> </label>
        <select
          id="client"
          formControlName="client"
          class="form-select"
          [class.error]="isFieldInvalid('client')"
        >
          <option value="">{{ isLoadingClients ? 'Carregando...' : 'Selecione um cliente' }}</option>
          <option *ngFor="let client of clients" [value]="client.nomeRazaoSocial">
            {{ client.nomeRazaoSocial }}
          </option>
        </select>
        <div class="error-message" *ngIf="isFieldInvalid('client')">
          Cliente é obrigatório
        </div>
      </div>

      <div class="form-group">
        <label for="proposal">
          Proposta/Projeto <span class="required">*</span>
        </label>
        <select
          id="proposal"
          formControlName="proposal"
          class="form-select"
          [class.error]="isFieldInvalid('proposal')"
        >
          <option value="">{{ isLoadingProposals ? 'Carregando...' : 'Selecione uma proposta' }}</option>
          <option *ngFor="let proposal of proposals" [value]="proposal.titulo">
            {{ proposal.titulo }}
          </option>
        </select>
        <div class="error-message" *ngIf="isFieldInvalid('proposal')">
          Proposta é obrigatória
        </div>
      </div>

      <div class="form-group">
        <label for="priority">Prioridade</label>
        <select id="priority" formControlName="priority" class="form-select">
          <option value="low">Baixa</option>
          <option value="medium">Média</option>
          <option value="high">Alta</option>
        </select>
      </div>

      <div class="form-group">
        <label for="status">Status</label>
        <select id="status" formControlName="status" class="form-select">
          <option value="a-fazer">A Fazer</option>
          <option value="em-progresso">Em Progresso</option>
          <option value="concluido">Concluído</option>
        </select>
      </div>

      <div class="form-group">
        <label for="startDate">Data de Início</label>
        <input
          type="date"
          id="startDate"
          formControlName="startDate"
          class="form-input"
        />
      </div>

      <div class="form-group">
        <label for="dueDate">Data de Entrega</label>
        <input
          type="date"
          id="dueDate"
          formControlName="dueDate"
          class="form-input"
        />
      </div>
    </div>
  </form>

  <div slot="footer" class="modal-actions" *ngIf="!isViewMode">
    <button type="button" class="btn-secondary" (click)="onCancel()">
      Cancelar
    </button>
    <button
      type="submit"
      class="btn-primary"
      (click)="onSubmit()"
      [disabled]="taskForm.invalid || isSubmitting"
    >
      <span *ngIf="isSubmitting" class="loading-spinner"></span>
      {{ task?.id ? "Atualizar" : "Criar" }} Tarefa
    </button>
  </div>
</app-modal>
