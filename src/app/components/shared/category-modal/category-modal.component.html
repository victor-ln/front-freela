<app-modal
  [isOpen]="isOpen"
  [title]="category?.id ? 'Editar Categoria' : 'Nova Categoria'"
  size="md"
  (closed)="onModalClose()"
>
  <form
    [formGroup]="categoryForm"
    (ngSubmit)="onSubmit()"
    class="category-form"
  >
    <div class="form-grid">
      <div class="form-group">
        <label for="type"
          >Nome da Categoria <span class="required">*</span></label
        >
        <input
          type="text"
          id="type"
          formControlName="type"
          class="form-input"
          [class.error]="isFieldInvalid('type')"
          placeholder="Digite o nome da categoria"
        />
        <div class="error-message" *ngIf="isFieldInvalid('type')">
          Nome da categoria é obrigatório
        </div>
      </div>

      <div class="form-group">
        <label for="status">Status <span class="required">*</span></label>
        <select
          id="status"
          formControlName="status"
          class="form-select"
          [class.error]="isFieldInvalid('status')"
        >
          <option value="active">Ativo</option>
          <option value="inactive">Inativo</option>
        </select>
        <div class="error-message" *ngIf="isFieldInvalid('status')">
          Status é obrigatório
        </div>
      </div>
    </div>

    <div class="form-info">
      <div class="info-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 16v-4M12 8h.01" />
        </svg>
      </div>
      <div class="info-content">
        <p>
          <strong>Dica:</strong> As categorias são utilizadas para organizar
          seus serviços e facilitar a busca e filtragem.
        </p>
        <p>Exemplos: Desenvolvimento, Design, Consultoria, Marketing</p>
      </div>
    </div>
  </form>

  <div slot="footer" class="modal-actions">
    <button type="button" class="btn-secondary" (click)="onCancel()">
      Cancelar
    </button>
    <button
      type="submit"
      class="btn-primary"
      (click)="onSubmit()"
      [disabled]="categoryForm.invalid || isSubmitting"
    >
      <span *ngIf="isSubmitting" class="loading-spinner"></span>
      {{ category?.id ? "Atualizar" : "Criar" }} Categoria
    </button>
  </div>
</app-modal>
