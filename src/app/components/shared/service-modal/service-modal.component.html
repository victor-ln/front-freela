<app-modal
  [isOpen]="isOpen"
  [title]="service?.id ? 'Editar Serviço' : 'Novo Serviço'"
  size="lg"
  (closed)="onModalClose()"
>
  <form [formGroup]="serviceForm" (ngSubmit)="onSubmit()" class="service-form">
    <div class="form-grid">
      <div class="form-group full-width">
        <label for="name">Nome do Serviço <span class="required">*</span></label>
        <input type="text" id="name" formControlName="name" class="form-input" [class.error]="isFieldInvalid('name')" />
        <div class="error-message" *ngIf="isFieldInvalid('name')">Nome é obrigatório</div>
      </div>
      <div class="form-group full-width">
        <label for="description">Descrição <span class="required">*</span></label>
        <textarea id="description" formControlName="description" class="form-textarea" rows="3"></textarea>
      </div>

      <div class="form-group">
        <label for="categoryId">Categoria <span class="required">*</span></label>
        <select id="categoryId" formControlName="categoryId" class="form-select" [class.error]="isFieldInvalid('categoryId')">
          <option value="">Selecione uma categoria</option>
          <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.tipo }}</option>
        </select>
        <div class="error-message" *ngIf="isFieldInvalid('categoryId')">Categoria é obrigatória</div>
      </div>

      <div class="form-group">
        <label for="deliveryTime">Prazo de Entrega <span class="required">*</span></label>
        <input type="number" id="deliveryTime" formControlName="deliveryTime" class="form-input" />
      </div>
      <div class="form-group">
        <label for="timeUnit">Unidade de Tempo <span class="required">*</span></label>
        <select id="timeUnit" formControlName="timeUnit" class="form-select">
          <option value="">Selecione</option>
          <option value="horas">Horas</option>
          <option value="dias">Dias</option>
          <option value="semanas">Semanas</option>
          <option value="meses">Meses</option>
        </select>
      </div>

      <div class="form-group">
        <label for="templateBaseId">Template Base</label>
        <select id="templateBaseId" formControlName="templateBaseId" class="form-select">
          <option value="">Nenhum template</option>
          <option *ngFor="let tmpl of templates" [value]="tmpl.id">{{ tmpl.nome }}</option>
        </select>
      </div>

      <div class="form-group">
        <label for="status">Status <span class="required">*</span></label>
        <select id="status" formControlName="status" class="form-select">
          <option value="active">Ativo</option>
          <option value="inactive">Inativo</option>
        </select>
      </div>
      <div class="form-group">
        <label for="basePrice">Preço Base (R$) <span class="required">*</span></label>
        <input type="number" id="basePrice" formControlName="basePrice" class="form-input" step="0.01" />
      </div>
    </div>
  </form>

  <div slot="footer" class="modal-actions">
    <button type="button" class="btn-secondary" (click)="onCancel()">Cancelar</button>
    <button type="submit" class="btn-primary" (click)="onSubmit()" [disabled]="serviceForm.invalid || isSubmitting">
      <span *ngIf="isSubmitting" class="loading-spinner"></span>
      {{ service?.id ? "Atualizar" : "Criar" }} Serviço
    </button>
  </div>
</app-modal>
