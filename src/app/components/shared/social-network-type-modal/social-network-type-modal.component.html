<app-modal
  [isOpen]="isOpen"
  [title]="
    socialNetworkType?.id
      ? 'Editar Tipo de Rede Social'
      : 'Novo Tipo de Rede Social'
  "
  size="md"
  (closed)="onModalClose()"
>
  <form
    [formGroup]="socialNetworkTypeForm"
    (ngSubmit)="onSubmit()"
    class="social-network-type-form"
  >
    <div class="form-grid">
      <div class="form-group">
        <label for="type"
          >Tipo de Rede Social <span class="required">*</span></label
        >
        <input
          type="text"
          id="type"
          formControlName="type"
          class="form-input"
          [class.error]="isFieldInvalid('type')"
          placeholder="Ex: Facebook, Instagram, LinkedIn"
        />
        <div class="error-message" *ngIf="isFieldInvalid('type')">
          Tipo é obrigatório
        </div>
      </div>

      <div class="form-group">
        <label for="status">Status <span class="required">*</span></label>
        <select
          id="status"
          formControlName="status"
          class="form-select"
          [class.error]="isFieldInvalid('status')"
        >
          <option value="active">Ativo</option>
          <option value="inactive">Inativo</option>
        </select>
        <div class="error-message" *ngIf="isFieldInvalid('status')">
          Status é obrigatório
        </div>
      </div>
    </div>

    <div class="form-info">
      <div class="info-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 16v-4M12 8h.01" />
        </svg>
      </div>
      <div class="info-content">
        <p><strong>Sobre os tipos de rede social:</strong></p>
        <p>
          Os tipos criados aqui serão utilizados para categorizar as redes
          sociais dos seus clientes.
        </p>
        <p>
          <strong>Exemplos comuns:</strong> Facebook, Instagram, LinkedIn,
          Twitter, TikTok, YouTube, WhatsApp Business
        </p>
      </div>
    </div>
  </form>

  <div slot="footer" class="modal-actions">
    <button type="button" class="btn-secondary" (click)="onCancel()">
      Cancelar
    </button>
    <button
      type="submit"
      class="btn-primary"
      (click)="onSubmit()"
      [disabled]="socialNetworkTypeForm.invalid || isSubmitting"
    >
      <span *ngIf="isSubmitting" class="loading-spinner"></span>
      {{ socialNetworkType?.id ? "Atualizar" : "Criar" }} Tipo
    </button>
  </div>
</app-modal>
