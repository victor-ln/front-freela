<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <img src="assets/freelaflow.png" alt="FreelaFlow Logo" class="logo" />
      <h2>Bem-vindo de volta!</h2>
      <p>Faça login para continuar gerenciando seus projetos.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="username">Email</label>
        <input
          type="email"
          id="username"
          formControlName="username"
          class="form-input"
          placeholder="seu@email.com"
          [class.error]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
        />
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-input"
          placeholder="Sua senha"
          [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        />
      </div>

      <div class="form-options">
        <a routerLink="/forgot-password" class="forgot-password">Esqueceu a senha?</a>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="loginForm.invalid || isSubmitting">
        <span *ngIf="!isSubmitting">Entrar</span>
        <span *ngIf="isSubmitting" class="loading-spinner"></span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Não tem uma conta? <a routerLink="/register">Cadastre-se</a></p>
    </div>
  </div>
</div>
