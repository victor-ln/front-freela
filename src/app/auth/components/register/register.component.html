<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <img src="assets/freelaflow.png" alt="FreelaFlow Logo" class="logo" />
      <h2>Crie sua Conta</h2>
      <p>Comece a gerenciar seus projetos com eficiência.</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" formControlName="nome" class="form-input" placeholder="Seu nome completo" />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" formControlName="email" class="form-input" placeholder="seu@email.com" />
      </div>

      <div class="form-group">
        <label for="cpfCnpj">CPF/CNPJ</label>
        <input type="text" id="cpfCnpj" formControlName="cpfCnpj" class="form-input" placeholder="000.000.000-00" />
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" formControlName="senha" class="form-input" placeholder="Mínimo 6 caracteres" />
      </div>

      <div class="form-section">
        <h3>Endereço</h3>

        <div class="form-row">
          <div class="form-group form-group-small">
            <label for="cep">CEP</label>
            <input type="text" id="cep" formControlName="cep" class="form-input" placeholder="00000-000" />
          </div>
        </div>

        <div class="form-group">
          <label for="ruaAvenida">Rua/Avenida</label>
          <input type="text" id="ruaAvenida" formControlName="ruaAvenida" class="form-input" placeholder="Nome da rua ou avenida" />
        </div>

        <div class="form-row">
          <div class="form-group form-group-small">
            <label for="numero">Número</label>
            <input type="text" id="numero" formControlName="numero" class="form-input" placeholder="123" />
          </div>

          <div class="form-group form-group-large">
            <label for="complemento">Complemento (opcional)</label>
            <input type="text" id="complemento" formControlName="complemento" class="form-input" placeholder="Apto, Bloco, etc" />
          </div>
        </div>

        <div class="form-group">
          <label for="bairro">Bairro</label>
          <input type="text" id="bairro" formControlName="bairro" class="form-input" placeholder="Nome do bairro" />
        </div>

        <div class="form-row">
          <div class="form-group form-group-large">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" formControlName="cidade" class="form-input" placeholder="Nome da cidade" />
          </div>

          <div class="form-group form-group-small">
            <label for="estado">Estado</label>
            <input type="text" id="estado" formControlName="estado" class="form-input" placeholder="UF" maxlength="2" />
          </div>
        </div>

        <div class="form-group">
          <label for="pais">País</label>
          <input type="text" id="pais" formControlName="pais" class="form-input" placeholder="Brasil" />
        </div>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>
       <div *ngIf="successMessage" class="success-message">
        {{ successMessage }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="registerForm.invalid || isSubmitting">
        <span *ngIf="!isSubmitting">Criar Conta</span>
        <span *ngIf="isSubmitting" class="loading-spinner"></span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Já tem uma conta? <a routerLink="/login">Faça login</a></p>
    </div>
  </div>
</div>
