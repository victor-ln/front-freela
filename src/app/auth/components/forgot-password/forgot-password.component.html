<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <img src="assets/freelaflow.png" alt="FreelaFlow Logo" class="logo" />
      <h2>Recuperar Senha</h2>
      <p>Digite seu e-mail para receber o link de recuperação.</p>
    </div>

    <form [formGroup]="recoveryForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" formControlName="email" class="form-input" placeholder="seu@email.com" />
      </div>

      <div *ngIf="message" [ngClass]="isError ? 'error-message' : 'success-message'">
        {{ message }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="recoveryForm.invalid || isSubmitting">
        <span *ngIf="!isSubmitting">Enviar Link</span>
        <span *ngIf="isSubmitting" class="loading-spinner"></span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Lembrou a senha? <a routerLink="/login">Voltar para o login</a></p>
    </div>
  </div>
</div>
