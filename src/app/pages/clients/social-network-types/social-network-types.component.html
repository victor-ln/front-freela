<div class="social-network-types-content">
  <div class="content-header">
    <h2>Tipos de Redes Sociais</h2>
    <button class="btn-primary" (click)="openNewSocialNetworkTypeModal()">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 5v14m-7-7h14" />
      </svg>
      Novo Tipo
    </button>
  </div>

  <div class="types-grid">
    <div *ngFor="let type of types" class="type-card">
      <div class="type-header">
        <div class="type-icon" [class]="type.type.toLowerCase()">
          <i [innerHTML]="getTypeIcon(type.type)"></i>
        </div>
        <div class="type-info">
          <h3>{{ type.type }}</h3>
          <span class="status" [class]="type.status">
            {{ type.status === "active" ? "Ativo" : "Inativo" }}
          </span>
        </div>
      </div>

      <div class="type-stats">
        <div class="stat">
          <span class="stat-number">{{ type.usage }}</span>
          <span class="stat-label">Redes cadastradas</span>
        </div>
      </div>

      <div class="type-actions">
        <button class="btn-icon" title="Editar" (click)="openEditSocialNetworkTypeModal(type)">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
            />
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
          </svg>
        </button>
        <button
          class="btn-icon"
          [class.danger]="type.usage === 0"
          [disabled]="type.usage > 0"
          title="Excluir"
          (click)="confirmDeleteSocialNetworkType(type)"
        >
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
            />
          </svg>
        </button>
      </div>
    </div>

    <div class="add-type-card" (click)="openNewSocialNetworkTypeModal()">
      <div class="add-content">
        <div class="add-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 5v14m-7-7h14" />
          </svg>
        </div>
        <h3>Adicionar Novo Tipo</h3>
        <p>Crie um novo tipo de rede social para seus clientes</p>
        <button class="btn-secondary">Criar Tipo</button>
      </div>
    </div>
  </div>
</div>

<app-social-network-type-modal
  [isOpen]="isSocialNetworkTypeModalOpen"
  [socialNetworkType]="selectedSocialNetworkType"
  (closed)="closeSocialNetworkTypeModal()"
  (socialNetworkTypeSaved)="handleSocialNetworkTypeSaved($event)">
</app-social-network-type-modal>

<app-confirm-modal
  [isOpen]="isConfirmModalOpen"
  title="Confirmar Exclusão"
  message="Tem certeza que deseja excluir este tipo de rede social?"
  (confirmed)="deleteSocialNetworkTypeConfirmed()"
  (closed)="closeConfirmModal()">
</app-confirm-modal>
