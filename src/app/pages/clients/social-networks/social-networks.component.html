<div class="social-networks-content">
  <div class="content-header">
    <h2>Redes Sociais dos Clientes</h2>
    <button class="btn-primary" (click)="openNewSocialNetworkModal()">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 5v14m-7-7h14" />
      </svg>
      Nova Rede Social
    </button>
  </div>

  <app-filter-bar
    [data]="mockSocialNetworks"
    [searchFields]="searchFields"
    [selectFilters]="selectFilters"
    searchPlaceholder="Buscar por nome, cliente ou URL..."
    (filteredData)="handleFilteredData($event)"
  ></app-filter-bar>

  <div class="table-container">
    <table class="social-networks-table">
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Nome da Rede</th>
          <th>Tipo</th>
          <th>URL</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let network of filteredSocialNetworks">
          <td>
            <div class="client-info">
              <div class="client-avatar">
                {{ getInitials(network.clientName) }}
              </div>
              <span>{{ network.clientName }}</span>
            </div>
          </td>
          <td>{{ network.name }}</td>
          <td>
            <span class="network-type" [class]="network.type.toLowerCase()">
              <i [innerHTML]="getNetworkIcon(network.type)"></i>
              {{ network.type }}
            </span>
          </td>
          <td>
            <a [href]="network.url" target="_blank" class="network-url">
              {{ network.url }}
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6m4-3h6v6m-11 5L18 3"
                />
              </svg>
            </a>
          </td>
          <td>
            <div class="actions">
              <button class="btn-icon" title="Editar" (click)="openEditSocialNetworkModal(network)">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path
                    d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
                  />
                  <path
                    d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
                  />
                </svg>
              </button>
              <button class="btn-icon danger" title="Excluir" (click)="confirmDeleteSocialNetwork(network)">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path
                    d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
                  />
                </svg>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<app-social-network-modal
  [isOpen]="isSocialNetworkModalOpen"
  [socialNetwork]="selectedSocialNetwork"
  (closed)="closeSocialNetworkModal()"
  (socialNetworkSaved)="handleSocialNetworkSaved($event)">
</app-social-network-modal>

<app-confirm-modal
  [isOpen]="isConfirmModalOpen"
  title="Confirmar Exclusão"
  message="Tem certeza que deseja excluir esta rede social?"
  (confirmed)="deleteSocialNetworkConfirmed()"
  (closed)="closeConfirmModal()">
</app-confirm-modal>
