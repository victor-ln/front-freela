<div class="categories-page">
  <div class="page-header">
    <div class="header-content">
      <h1>Categorias de Serviços</h1>
      <p class="subtitle">
        Organize seus serviços por categorias para facilitar a gestão
      </p>
    </div>
    <button class="btn-primary" (click)="openNewCategoryModal()">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 5v14m-7-7h14" />
      </svg>
      Nova Categoria
    </button>
  </div>

  <div class="categories-grid">
    <div *ngIf="isLoading" class="loading-message">
      Carregando categorias...
    </div>

    <div *ngFor="let category of categories" class="category-card">
      <div class="category-header">
        <div class="category-icon" [class]="category.tipo.toLowerCase()">
          <i [innerHTML]="getCategoryIcon(category.tipo)"></i>
        </div>
        <div class="category-actions">
          <button class="btn-icon" title="Editar" (click)="openEditCategoryModal(category)">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
              />
              <path
                d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
              />
            </svg>
          </button>
          <button
            class="btn-icon danger"
            title="Excluir"
            (click)="confirmDeleteCategory(category)"
          >
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
              />
            </svg>
          </button>
        </div>
      </div>

      <div class="category-content">
        <h3>{{ category.tipo }}</h3>
        <span class="status" [class]="category.status ? 'active' : 'inactive'">
          {{ category.status ? "Ativo" : "Inativo" }}
        </span>
      </div>
    </div>

    <div class="add-category-card" (click)="openNewCategoryModal()">
      <div class="add-content">
        <div class="add-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 5v14m-7-7h14" />
          </svg>
        </div>
        <h3>Adicionar Nova Categoria</h3>
        <p>Crie uma nova categoria para organizar seus serviços</p>
        <button class="btn-secondary">Criar Categoria</button>
      </div>
    </div>
  </div>

  <app-category-modal
    [isOpen]="isCategoryModalOpen"
    [category]="selectedCategory"
    (closed)="closeCategoryModal()"
    (categorySaved)="handleCategorySaved($event)">
  </app-category-modal>

  <app-confirm-modal
    [isOpen]="isConfirmModalOpen"
    title="Confirmar Exclusão"
    message="Tem certeza que deseja excluir esta categoria?"
    (confirmed)="deleteCategoryConfirmed()"
    (closed)="closeConfirmModal()">
  </app-confirm-modal>
</div>
